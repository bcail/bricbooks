on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

jobs:
  ubuntu-2404:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.11', '3.14', '3.15']
    name: Python ${{ matrix.python-version }} Linux tests
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - run: sudo apt-get update
      - run: sudo apt-get install -y xvfb
      - run: python -Werr tests.py
      - run: xvfb-run python -Werr tests_tk.py

  ubuntu-2204:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.7', '3.13']
    name: Python ${{ matrix.python-version }} Linux tests
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - run: sudo apt-get update
      - run: sudo apt-get install -y xvfb
      - run: python -Werr tests.py
      - run: xvfb-run python -Werr tests_tk.py

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    name: Python ${{ matrix.python-version }} Windows tests
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - run: python -Werr tests.py
      - run: python -Werr tests_tk.py

  mac:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.14']
    name: Python ${{ matrix.python-version }} Macos tests
    steps:
      - uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - run: python -Werr tests.py
      - run: python -Werr tests_tk.py
